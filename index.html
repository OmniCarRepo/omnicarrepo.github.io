<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tâm sự</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #fafafa; --fg: #222; --muted: #888; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #777; } }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 18px/1.7 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 0 16px; box-sizing: border-box; text-align: center;
  }
  main { max-width: 600px; }
  p { margin: 0 0 1em; white-space: pre-line; }
  .date { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <!-- Sửa dòng tâm sự ở đây -->
  <p>Dự án OmniCar đã dừng lại. Cảm ơn mọi người đã đồng hành.</p>
  <p class="date">27/10/2026</p>
</main>
</body>
</html>
